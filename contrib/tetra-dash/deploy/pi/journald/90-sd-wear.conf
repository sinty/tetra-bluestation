# Беречь SD-карту. Ставится в /etc/systemd/journald.conf.d/90-sd-wear.conf
#
# Журнал остаётся на карте: без него не разобрать, почему машина перезагрузилась.
# Но сбрасывается раз в 10 минут, а не при каждой записи, и не растёт больше 200 МБ.
# Сообщения уровня crit и выше journald всё равно сбрасывает немедленно.
[Journal]
Storage=persistent
SyncIntervalSec=10min
SystemMaxUse=200M
RuntimeMaxUse=64M
