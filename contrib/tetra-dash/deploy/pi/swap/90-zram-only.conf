# Беречь SD-карту. Ставится в /etc/rpi/swap.conf.d/90-zram-only.conf
#
# Raspberry Pi OS по умолчанию использует zram+file: сжатый своп в памяти,
# который по таймеру сбрасывает редко используемые страницы в файл /var/swap
# на карте. Здесь только zram, без файла. Памяти 8 ГБ, станция с панелью
# занимают около 400 МБ — своп нужен лишь как страховка.
#
# Действует после перезагрузки; затем файл /var/swap можно удалить.
[Main]
Mechanism=zram
