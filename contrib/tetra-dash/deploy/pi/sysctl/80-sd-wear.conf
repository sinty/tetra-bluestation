# Беречь SD-карту: копить записи в памяти и сбрасывать пачками.
# Ставится в /etc/sysctl.d/80-sd-wear.conf, работает в паре с commit=600
# в /etc/fstab для корневой ФС.
#
# Цена: при внезапном отключении питания теряются последние ~10 минут записей.
# Всё, что терять нельзя (флаг «станция нужна»), пишущий сбрасывает сам через sync.
vm.dirty_expire_centisecs = 60000
vm.dirty_writeback_centisecs = 6000
