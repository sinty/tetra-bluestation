# Ядра для станции на Raspberry Pi / CM4 (4 ядра).
#
# Ставится в /etc/systemd/system/bluestation-bs.service.d/10-pi-cores.conf
#
# На виртуалке с двумя ядрами станция была заперта на ядре 0. На Pi так
# нельзя: прерывания USB и Ethernet по умолчанию обрабатываются на ядре 0,
# и главный поток станции с приоритетом FIFO 73 отнимал бы у них время.
# Поток IQ от Pluto идёт по USB — задушить его обработку значит получить
# те самые штормы "Too late to produce TX block".
#
# Поэтому станции ядра 2 и 3, а 0 и 1 остаются прерываниям, sshd, журналу,
# панели и чёрному ящику.

[Service]
CPUAffinity=
CPUAffinity=2 3
