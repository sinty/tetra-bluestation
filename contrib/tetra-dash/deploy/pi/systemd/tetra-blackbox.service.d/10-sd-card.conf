# Чёрный ящик на машине с SD-картой.
#
# Ставится в /etc/systemd/system/tetra-blackbox.service.d/10-sd-card.conf
#
# Штатно ящик пишет строку раз в секунду и сразу делает sync — это две
# принудительные записи в секунду, 170 тысяч в сутки. SD-карта такого долго
# не выдерживает. Здесь журнал живёт в памяти (/run), а на карту попадает
# только при штатной остановке: выключение, перезагрузка, перезапуск службы.
#
# Цена: при внезапной смерти машины последние записи пропадут. Разбирать
# сбои тогда придётся по журналу systemd — он остаётся на карте, но
# сбрасывается пачками раз в 10 минут (journald.conf.d/90-sd-wear.conf).
#
# Когда станция переедет на SSD, этот файл можно просто удалить.

[Service]
Environment=LOG=/run/tetra-blackbox/blackbox.log
Environment=SYNC=0
RuntimeDirectory=tetra-blackbox
RuntimeDirectoryPreserve=yes
ExecStopPost=/bin/sh -c 'test -s /run/tetra-blackbox/blackbox.log && gzip -c /run/tetra-blackbox/blackbox.log > /var/log/tetra-blackbox.last.gz; true'
