# Буферы UDP под поток IQ от Pluto+ (раздел 4 и 14 журнала).
# Стоковые 212992 дают "Lost N samples" и панику PHY через 10-15 минут.
# RX идёт от Pluto к хосту, поэтому нужны и приёмные, и передающие.
net.core.rmem_max = 33554432
net.core.rmem_default = 33554432
net.core.wmem_max = 33554432
net.core.wmem_default = 33554432
net.core.netdev_max_backlog = 5000
