# Обнаружение блокировок ядра гостя.
#
# Ставится в /etc/sysctl.d/91-lockup-detect.conf
#
# Установлено 10.09.2026: виртуалка замирает от ЖЁСТКОЙ блокировки ядра —
# цикла с запрещёнными прерываниями. Процесс qemu при этом жив и жжёт целое
# ядро, хост и хранилище чисты, гость не отвечает даже на консоль.
#
# Такую блокировку способен обнаружить только NMI-сторож, которому нужен
# аппаратный счётчик производительности. У гостя KVM его нет, если хост
# не прокинул vPMU:
#
#     qm set <VMID> -cpu host        # на стороне Proxmox, затем Stop/Start
#
# Без этого настройки ниже поймают лишь мягкие блокировки — но и они полезны:
# если авария окажется мягкой, мы наконец увидим трассировку.

# Порог срабатывания: 10 секунд вместо штатных 10 (оставляем), но детекторы
# включаем явно, чтобы их нельзя было выключить чем-то ещё.
kernel.watchdog = 1
kernel.watchdog_thresh = 10
kernel.nmi_watchdog = 1

# Задача в непрерываемом ожидании дольше минуты — печатать трассировку.
# Штатные две минуты слишком долго: мы теряем машину раньше.
kernel.hung_task_timeout_secs = 60

# Блокировка должна заканчиваться паникой, а не бесконечным зависанием:
# паника печатает трассировку и перезагружает машину через 10 секунд.
# Это превращает многочасовой простой в минутный, а главное — оставляет
# улику. Без этого ядро просто печатает предупреждение и продолжает висеть.
kernel.softlockup_panic = 1
kernel.hardlockup_panic = 1
kernel.panic_on_oops = 1
kernel.panic = 10

# Трассировку надо ещё и увидеть. Она уходит в консоль, поэтому на стороне
# хоста нужна последовательная консоль с записью:
#
#     qm set <VMID> -serial0 socket
#     qm terminal <VMID> | ts | tee -a /var/log/tetrabs-serial.log
#
# и console=ttyS0,115200 в параметрах ядра гостя.
kernel.printk = 7 4 1 7
