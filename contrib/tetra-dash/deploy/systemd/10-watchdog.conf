# Аппаратный сторож: автоматический сброс зависшей машины.
#
# Ставится в /etc/systemd/system.conf.d/10-watchdog.conf
#
# Зачем. Виртуалка семь раз замирала намертво: журнал обрывается на полуслове,
# консоль не отвечает, детектор жёстких зависаний в KVM недоступен (нет
# аппаратного счётчика), и поднять её может только ручной сброс. Простои
# доходили до 13 часов — ровно столько, сколько прошло до того, как оператор
# заметил.
#
# Как работает. systemd открывает /dev/watchdog и гладит его вдвое чаще
# указанного срока. Если PID 1 перестал получать процессорное время —
# а при наших зависаниях останавливается всё, включая его, — сторож
# срабатывает, и гипервизор сбрасывает машину. Простой становится минутой
# вместо часов.
#
# ВАЖНО: само по себе это не работает. Устройство сторожа должно быть
# включено в конфигурации виртуальной машины на стороне Proxmox:
#
#     qm set <VMID> -watchdog model=i6300esb,action=reset
#
# после чего машину надо выключить и включить (не reset — устройство
# добавляется при создании процесса qemu). Без устройства systemd просто
# запишет в журнал, что сторожа нет, и продолжит работать как прежде.
#
# Шестьдесят секунд выбраны как компромисс: короче — рискуем ложным сбросом
# при кратковременной перегрузке хоста, длиннее — дольше простой.

[Manager]
RuntimeWatchdogSec=60
RebootWatchdogSec=2min
